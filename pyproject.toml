[project]
name = "nocturne"
version = "0.1.0"
description = "Sleep-time compute agent that produces a morning briefing for a researcher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocturne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
